<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05050e" />
    <title>NEON SERPENT：霓虹吞星</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app" class="game-shell" data-phase="ready">
      <canvas id="game-canvas" class="game-canvas" aria-label="NEON SERPENT game canvas"></canvas>

      <div id="game-ui" class="game-ui">
        <header class="hud-strip" aria-label="游戏状态">
          <div class="hud-topline">
            <div class="brand-lockup" aria-label="NEON SERPENT">
              <span class="brand-mark"></span>
              <span class="brand-copy">
                <span class="brand-title">NEON SERPENT</span>
                <span class="brand-subtitle">霓虹吞星</span>
              </span>
            </div>

            <button id="pause-button" class="icon-button icon-button--quiet" type="button" aria-label="暂停游戏">
              ❚❚
            </button>
          </div>

          <div class="hud-status" aria-label="运行状态">
            <span id="build-version-label" class="hud-status__pill hud-status__pill--build">build dev</span>
            <span id="pvp-connection-label" class="hud-status__pill hud-status__pill--pvp" data-state="disconnected">PVP disconnected</span>
          </div>

          <div class="hud-cards" aria-label="当前信息">
            <section class="hud-card hud-card--length" aria-label="当前/目标长度">
              <span class="hud-card__label">当前/目标长度</span>
              <strong id="length-label" class="hud-card__value">4</strong>
            </section>

            <section class="hud-card hud-card--unlock" aria-label="下一个解锁">
              <strong id="unlock-title-label" class="hud-card__value">长度7解锁</strong>
              <span id="unlock-value-label" class="hud-card__subvalue">黑洞</span>
            </section>
          </div>

          <div class="hud-ticker" aria-label="操作提示" aria-live="polite" aria-atomic="true">
            <span id="ticker-current-label" class="hud-ticker__line hud-ticker__line--current">
              长按Shift减速，长按方向键加速
            </span>
            <span
              id="ticker-next-label"
              class="hud-ticker__line hud-ticker__line--next"
              aria-hidden="true"
            >
              注意，黑洞会把你吸入深渊
            </span>
          </div>
        </header>

        <div class="hud-lives" aria-label="剩余生命">
          <span id="life-heart-1" class="hud-life" data-active="true" aria-hidden="true">♥</span>
          <span id="life-heart-2" class="hud-life" data-active="true" aria-hidden="true">♥</span>
          <span id="life-heart-3" class="hud-life" data-active="true" aria-hidden="true">♥</span>
        </div>

        <section id="start-panel" class="start-panel" aria-label="开始界面">
          <div class="start-orbit" aria-hidden="true"></div>
          <p class="panel-kicker">SERPENT CORE ONLINE</p>
          <p id="panel-primary-label" class="panel-primary-label">准备开始</p>
          <h1 id="panel-primary-value">NEON SERPENT</h1>
          <p id="panel-secondary-label" class="panel-subtitle">霓虹吞星</p>
          <p id="panel-meta-label" class="panel-meta">长按方向键加速·长按Shift减速</p>
          <div id="entry-actions" class="entry-actions" hidden>
            <button id="pve-button" class="mode-card mode-card--pve" type="button" aria-label="进入 PVE 单人冒险">
              <span class="mode-card__eyebrow">PVE</span>
              <strong>单人冒险</strong>
              <span>进入原来的单人玩法</span>
            </button>
            <button id="pvp-button" class="mode-card mode-card--pvp" type="button" aria-label="进入 PVP 双蛇竞技">
              <span class="mode-card__eyebrow">PVP</span>
              <strong>双蛇竞技</strong>
              <span>默认自动匹配</span>
            </button>
          </div>
          <div id="pvp-room-panel" class="pvp-room-panel" hidden>
            <div id="room-queue-stats" class="room-stats" hidden>
              <span id="queue-wait-label" class="room-stat"></span>
              <span id="queue-online-label" class="room-stat"></span>
              <span id="queue-count-label" class="room-stat"></span>
            </div>
            <div class="room-actions">
              <button
                id="cancel-matchmaking-button"
                class="secondary-action secondary-action--accent secondary-action--wide"
                type="button"
                hidden
              >
                取消匹配
              </button>
              <button id="create-room-button" class="secondary-action" type="button">邀请好友</button>
              <button id="join-room-button" class="secondary-action" type="button">输入房间码</button>
              <label id="room-code-field" class="room-code-field" hidden>
                <span>房间码</span>
                <input id="room-code-input" type="text" inputmode="text" placeholder="输入房间码" autocomplete="off" />
              </label>
              <button id="copy-room-code-button" class="secondary-action secondary-action--wide" type="button" hidden>
                复制房间码
              </button>
              <button
                id="ready-room-button"
                class="secondary-action secondary-action--accent secondary-action--wide"
                type="button"
                hidden
              >
                准备
              </button>
            </div>
            <p id="room-status-label" class="room-status">点击 PVP 后会自动连接服务并寻找对手。</p>
            <p id="room-players-label" class="room-players" hidden></p>
            <button id="room-back-button" class="text-action" type="button">返回主界面</button>
          </div>
          <div id="settlement-actions" class="settlement-actions" hidden>
            <button id="continue-button" class="primary-action" type="button">继续游戏</button>
            <button id="main-menu-button" class="secondary-action" type="button">回到主界面</button>
          </div>
          <button id="start-button" class="primary-action" type="button">开始游戏</button>
        </section>

        <div id="touch-controls" class="touch-controls" aria-label="移动端控制">
          <div id="joystick" class="joystick" role="application" aria-label="方向摇杆">
            <span id="joystick-line" class="joystick-line" aria-hidden="true"></span>
            <span class="joystick-ring" aria-hidden="true"></span>
            <span id="joystick-knob" class="joystick-knob" aria-hidden="true"></span>
          </div>

          <button id="boost-button" class="boost-button" type="button" aria-label="冲刺">
            BOOST
          </button>
        </div>

        <aside class="diagnostic-strip" aria-label="运行状态">
          <span id="state-label">Ready</span>
          <span id="fps-label">-- FPS</span>
          <span id="size-label">-- x --</span>
          <span id="debug-local-tick-label" hidden></span>
          <span id="debug-remote-input-lag-label" hidden></span>
          <span id="debug-buffered-inputs-label" hidden></span>
          <span id="debug-connection-state-label" hidden></span>
          <span id="debug-player-slot-label" hidden></span>
        </aside>

        <div class="orientation-mask" role="status">
          <strong>建议横屏游玩</strong>
          <span>旋转设备后可获得更完整的操作空间。</span>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
